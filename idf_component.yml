license: MIT

description: ESP_Weight_Indicator is a component for weight measurement 

url: https://github.com/tuliocharles/esp_weight_indicator
repository: https://github.com/tuliocharles/esp_weight_indicator.git

maintainers:
  - "Túlio Carvalho <tulio.cefetmg@gmail.com>"

dependencies:
  idf: ">=6.0"
  espressif/esp_wifi_remote:
    version: ">=0.1.12"
    rules:
      - if: "target in [esp32p4, esp32h2]"
  tuliocharles/esp_nvs: 
    version: ">=0.0.3"
files:
  excludes:
    - build/
    - sdkconfig
    - "**/dependencies.lock"
    - .vscode/  