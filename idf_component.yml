license: MIT

description: ESP_Weight_Indicator is a component for weight measurement using load cells and HX711 ADC, designed for ESP32 microcontrollers. It provides an easy-to-use interface for reading weight data from load cells, making it ideal for applications such as smart scales, inventory management, and other weight-based projects.

url: https://github.com/tuliocharles/esp_weight_indicator
repository: https://github.com/tuliocharles/esp_weight_indicator.git

maintainers:
  - "Túlio Carvalho <tulio.cefetmg@gmail.com>"

dependencies:
  idf: ">=5.5"
  espressif/esp_wifi_remote:
    version: ">=0.1.12"
    rules:
      - if: "target in [esp32p4, esp32h2]"
  tuliocharles/esp_nvs: 
    version: ">=0.0.3"
files:
  excludes:
    - build/
    - sdkconfig
    - "**/dependencies.lock"
    - .vscode/  